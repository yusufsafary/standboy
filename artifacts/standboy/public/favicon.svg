<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rounded square -->
  <rect width="180" height="180" rx="36" fill="#FF3C00"/>

  <!-- Pixel art gameboy-inspired "S" lettermark -->
  <!-- Top bar of S -->
  <rect x="44" y="44" width="92" height="18" rx="4" fill="white"/>
  <!-- Middle bar of S -->
  <rect x="44" y="81" width="92" height="18" rx="4" fill="white"/>
  <!-- Bottom bar of S -->
  <rect x="44" y="118" width="92" height="18" rx="4" fill="white"/>
  <!-- Top-left vertical connector -->
  <rect x="44" y="44" width="18" height="55" rx="4" fill="white"/>
  <!-- Bottom-right vertical connector -->
  <rect x="118" y="81" width="18" height="55" rx="4" fill="white"/>

  <!-- Pixel dot accent (top-right corner of S, characteristic pixel) -->
  <rect x="118" y="44" width="18" height="18" rx="4" fill="white"/>
  <!-- Pixel dot accent (bottom-left corner of S) -->
  <rect x="44" y="118" width="18" height="18" rx="4" fill="white"/>
</svg>
